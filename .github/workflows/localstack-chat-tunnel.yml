name: LocalStack Chat App via Cloudflare Tunnel

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  chat-tunnel:
    name: Deploy chat app (Lambda + DynamoDB) on LocalStack and expose it via Cloudflare Quick Tunnel
    runs-on: ubuntu-latest
    environment: localstack
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_CI_TOKEN }}
        run: |
          set -euo pipefail
          docker run -d \
            --name localstack \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN" \
            -e LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1 \
            -e DEBUG=1 \
            localstack/localstack:latest

      - name: Wait for LocalStack to be healthy
        run: |
          set -euo pipefail
          echo "Polling http://localhost:4566/_localstack/health ..."
          for i in $(seq 1 60); do
            LAMBDA_STATUS=$(curl -sf http://localhost:4566/_localstack/health | jq -r '.services.lambda // "unknown"' 2>/dev/null || echo "unreachable")
            DYNAMODB_STATUS=$(curl -sf http://localhost:4566/_localstack/health | jq -r '.services.dynamodb // "unknown"' 2>/dev/null || echo "unreachable")
            if { [ "$LAMBDA_STATUS" = "available" ] || [ "$LAMBDA_STATUS" = "running" ]; } && \
               { [ "$DYNAMODB_STATUS" = "available" ] || [ "$DYNAMODB_STATUS" = "running" ]; }; then
              echo "LocalStack is healthy (lambda: $LAMBDA_STATUS, dynamodb: $DYNAMODB_STATUS) after $i attempt(s)."
              exit 0
            fi
            echo "  attempt $i/60: lambda=$LAMBDA_STATUS dynamodb=$DYNAMODB_STATUS, retrying..."
            sleep 5
          done
          echo "::error::LocalStack did not become healthy in time"
          docker logs localstack || true
          exit 1

      - name: Install awscli-local
        run: pip install "awscli-local[ver1]"

      - name: Create DynamoDB table for chat messages
        run: |
          set -euo pipefail
          awslocal dynamodb create-table \
            --table-name chat-messages \
            --attribute-definitions \
                AttributeName=room,AttributeType=S \
                AttributeName=sort_key,AttributeType=S \
            --key-schema \
                AttributeName=room,KeyType=HASH \
                AttributeName=sort_key,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST
          awslocal dynamodb wait table-exists --table-name chat-messages
          echo "DynamoDB table 'chat-messages' is active."

      - name: Create Lambda deployment package
        run: |
          set -euo pipefail
          cd lambda_functions/chat_app
          zip ../../function.zip handler.py

      - name: Deploy chat-app Lambda function
        run: |
          set -euo pipefail
          awslocal lambda create-function \
            --function-name chat-app \
            --runtime python3.11 \
            --handler handler.lambda_handler \
            --zip-file fileb://function.zip \
            --role arn:aws:iam::000000000000:role/lambda-role \
            --timeout 30 \
            --memory-size 256 \
            --environment "Variables={TABLE_NAME=chat-messages}"
          awslocal lambda wait function-active --function-name chat-app
          echo "Lambda function 'chat-app' is active."

      - name: Create public Function URL
        run: |
          set -euo pipefail
          awslocal lambda create-function-url-config \
            --function-name chat-app \
            --auth-type NONE

          awslocal lambda add-permission \
            --function-name chat-app \
            --statement-id FunctionURLAllowPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE

          FUNCTION_URL=$(awslocal lambda get-function-url-config \
            --function-name chat-app \
            --query 'FunctionUrl' --output text)
          LAMBDA_HOST=$(echo "$FUNCTION_URL" | sed -E 's#^https?://##; s#/$##')

          echo "FUNCTION_URL=$FUNCTION_URL" >> "$GITHUB_ENV"
          echo "LAMBDA_HOST=$LAMBDA_HOST" >> "$GITHUB_ENV"
          echo "Function URL: $FUNCTION_URL"
          echo "Lambda host:  $LAMBDA_HOST"

      - name: Check the app locally (Host header routing)
        run: |
          set -euo pipefail
          COOKIES=$(mktemp)

          curl -sf -H "Host: $LAMBDA_HOST" http://localhost:4566/ | tee /tmp/local-check-login.html
          grep -q "Join the chat" /tmp/local-check-login.html

          LOGIN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIES" \
            -H "Host: $LAMBDA_HOST" "http://localhost:4566/login?username=hello-world")
          [ "$LOGIN_STATUS" = "302" ] || { echo "::error::expected 302 from /login, got $LOGIN_STATUS"; exit 1; }

          curl -sf -b "$COOKIES" -H "Host: $LAMBDA_HOST" http://localhost:4566/ | tee /tmp/local-check-chat.html
          grep -q "hello-world" /tmp/local-check-chat.html

          # GET is used for /send (not the usual verb for a mutating action) because it's
          # the one request shape proven to survive the tunnel — see "Why every action
          # here is a plain GET request" in docs/localstack-chat-tunnel.md for why.
          SEND_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIES" \
            -H "Host: $LAMBDA_HOST" "http://localhost:4566/send?message=hello+world")
          [ "$SEND_STATUS" = "302" ] || { echo "::error::expected 302 from /send, got $SEND_STATUS"; exit 1; }

          curl -sf -b "$COOKIES" -H "Host: $LAMBDA_HOST" http://localhost:4566/ | tee /tmp/local-check-after-send.html
          grep -q "hello world" /tmp/local-check-after-send.html

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -L --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          set -euo pipefail
          # CRITICAL: LocalStack's gateway routes Lambda Function URL requests by
          # the incoming HTTP Host header, not by path. cloudflared proxies the
          # public *.trycloudflare.com traffic to http://localhost:4566, but
          # without --http-host-header it would forward the tunnel's own
          # trycloudflare.com Host header, which LocalStack wouldn't recognize
          # as any function. Rewriting the Host header to the Lambda's own
          # lambda-url.*.localhost.localstack.cloud domain makes LocalStack
          # route every request straight to the chat-app function.
          ./cloudflared tunnel --no-autoupdate --url http://localhost:4566 \
            --http-host-header "$LAMBDA_HOST" \
            > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          echo "Waiting for the Cloudflare Quick Tunnel URL to be assigned..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Failed to obtain a Cloudflare tunnel URL"
            cat cloudflared.log
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

      - name: Publish tunnel URL
        run: |
          {
            echo "## 🌐 Chat app is live"
            echo
            echo "**Public URL:** $TUNNEL_URL"
            echo
            echo "Open it in a browser, pick a display name, and start chatting."
            echo "Anyone with the link can read and post messages — there is no"
            echo "password, just a display name stored in DynamoDB with each message."
            echo
            echo "Routed through LocalStack (\`http://localhost:4566\`) to the"
            echo "\`chat-app\` Lambda Function URL host \`$LAMBDA_HOST\`"
            echo "via \`cloudflared --http-host-header\`."
            echo
            echo "This tunnel stays up for 20 minutes from the start of this run."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=============================================================="
          echo " 🌐 PUBLIC CHAT URL: $TUNNEL_URL"
          echo "=============================================================="

      - name: Hold tunnel open for 20 minutes
        run: |
          set -euo pipefail
          echo "Tunnel URL: $TUNNEL_URL"
          for minute in $(seq 1 20); do
            echo "[$(date -u +%H:%M:%S)] Tunnel active — minute ${minute}/20. URL: $TUNNEL_URL"
            # Print any chat-app Lambda invocation logs from the last minute so
            # errors from real traffic (browser requests, not just the check
            # above) show up here even if this run gets cancelled before the
            # 20 minutes are up.
            set +e
            awslocal logs filter-log-events \
              --log-group-name /aws/lambda/chat-app \
              --start-time "$(( ($(date +%s) - 65) * 1000 ))" \
              --query 'events[].message' --output text 2>/dev/null | \
              sed '/^$/d;s/^/  [chat-app] /'
            set -e
            sleep 60
          done
          echo "20-minute hold complete."

      - name: Save chat-app and LocalStack logs
        # if: always() so this still runs whether the run finished the full
        # 20-minute hold, failed, or was cancelled — it must run before the
        # "Tear down" step below removes the container these logs live in.
        if: always()
        run: |
          set +e
          mkdir -p logs
          awslocal logs filter-log-events \
            --log-group-name /aws/lambda/chat-app \
            --output json > logs/chat-app-lambda.json 2>logs/chat-app-lambda.err
          docker logs localstack > logs/localstack-container.log 2>&1
          echo "Saved $(jq '.events | length' logs/chat-app-lambda.json 2>/dev/null || echo '0') chat-app log event(s) and $(wc -l < logs/localstack-container.log 2>/dev/null || echo 0) LocalStack container log line(s)."

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-tunnel-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down tunnel and LocalStack
        if: always()
        run: |
          if [ -f cloudflared.pid ]; then
            PID=$(cat cloudflared.pid)
            echo "Stopping cloudflared (pid $PID)..."
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          fi
          docker stop localstack 2>/dev/null || true
          docker rm localstack 2>/dev/null || true
          echo "Teardown complete."
