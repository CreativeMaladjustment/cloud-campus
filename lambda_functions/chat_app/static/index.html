<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalStack Chat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-alt: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-text: #04263b;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }

  /* Login screen */
  #login-screen {
    width: 100%;
    max-width: 360px;
    padding: 2rem;
  }
  #login-screen h1 {
    font-size: 1.4rem;
    margin: 0 0 0.25rem;
  }
  #login-screen p {
    color: var(--muted);
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  #login-form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  #login-error {
    color: #fca5a5;
    font-size: 0.85rem;
    min-height: 1.1em;
  }

  input, button, textarea {
    font: inherit;
    color: inherit;
  }
  input[type="text"] {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.75rem;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  /* Chat screen */
  #chat-screen {
    width: 100%;
    max-width: 560px;
    height: min(80vh, 720px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--border);
  }
  #chat-header h1 {
    font-size: 1rem;
    margin: 0;
  }
  #chat-header .who {
    color: var(--muted);
    font-weight: 400;
  }
  #logout-button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.4rem 0.7rem;
    font-weight: 500;
    font-size: 0.85rem;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  #messages .empty {
    color: var(--muted);
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
  }
  .message {
    max-width: 80%;
    padding: 0.5rem 0.7rem;
    border-radius: 10px;
    background: var(--panel-alt);
    align-self: flex-start;
  }
  .message.own {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-text);
  }
  .message .meta {
    display: block;
    font-size: 0.72rem;
    opacity: 0.75;
    margin-bottom: 0.15rem;
  }
  .message .text {
    white-space: pre-wrap;
    word-break: break-word;
  }

  #compose {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    border-top: 1px solid var(--border);
  }
  #compose input[type="text"] {
    flex: 1;
  }
  #chat-error {
    color: #fca5a5;
    font-size: 0.8rem;
    padding: 0 0.75rem 0.5rem;
    min-height: 1em;
  }
</style>
</head>
<body>

<main id="login-screen">
  <h1>Join the chat</h1>
  <p>Pick a display name. No password — anyone with the link can read and post messages.</p>
  <form id="login-form">
    <input type="text" id="username-input" placeholder="Your name" maxlength="32" autocomplete="off" required>
    <button type="submit">Join chat</button>
    <div id="login-error"></div>
  </form>
</main>

<main id="chat-screen" hidden>
  <div id="chat-header">
    <h1>Chat <span class="who" id="who-label"></span></h1>
    <button id="logout-button" type="button">Log out</button>
  </div>
  <div id="messages"><div class="empty">No messages yet — say hello.</div></div>
  <div id="chat-error"></div>
  <form id="compose">
    <input type="text" id="message-input" placeholder="Type a message" maxlength="500" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</main>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "chatUsername";
  const POLL_INTERVAL_MS = 3000;

  const loginScreen = document.getElementById("login-screen");
  const chatScreen = document.getElementById("chat-screen");
  const loginForm = document.getElementById("login-form");
  const usernameInput = document.getElementById("username-input");
  const loginError = document.getElementById("login-error");
  const whoLabel = document.getElementById("who-label");
  const logoutButton = document.getElementById("logout-button");
  const messagesEl = document.getElementById("messages");
  const composeForm = document.getElementById("compose");
  const messageInput = document.getElementById("message-input");
  const chatError = document.getElementById("chat-error");

  let username = null;
  let pollTimer = null;

  function showLogin() {
    chatScreen.hidden = true;
    loginScreen.hidden = false;
    usernameInput.value = "";
    loginError.textContent = "";
    usernameInput.focus();
  }

  function showChat() {
    loginScreen.hidden = true;
    chatScreen.hidden = false;
    whoLabel.textContent = "— " + username;
    messageInput.focus();
    fetchMessages();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(fetchMessages, POLL_INTERVAL_MS);
  }

  function renderMessages(messages) {
    const wasNearBottom =
      messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;

    messagesEl.innerHTML = "";
    if (!messages.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No messages yet — say hello.";
      messagesEl.appendChild(empty);
      return;
    }

    for (const item of messages) {
      const bubble = document.createElement("div");
      bubble.className = "message" + (item.username === username ? " own" : "");

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = item.username;

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = item.message;

      bubble.appendChild(meta);
      bubble.appendChild(text);
      messagesEl.appendChild(bubble);
    }

    if (wasNearBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function fetchMessages() {
    try {
      const res = await fetch("/api/messages");
      if (!res.ok) throw new Error("failed to load messages");
      const data = await res.json();
      renderMessages(data.messages || []);
    } catch (err) {
      chatError.textContent = "Couldn't refresh messages. Retrying…";
    }
  }

  async function sendMessage(text) {
    const res = await fetch("/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, message: text }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || "failed to send message");
    }
  }

  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    const value = usernameInput.value.trim();
    if (!value) {
      loginError.textContent = "Enter a name to continue.";
      return;
    }
    username = value;
    localStorage.setItem(STORAGE_KEY, username);
    showChat();
  });

  logoutButton.addEventListener("click", function () {
    username = null;
    localStorage.removeItem(STORAGE_KEY);
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    showLogin();
  });

  composeForm.addEventListener("submit", function (event) {
    event.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;
    chatError.textContent = "";
    messageInput.disabled = true;
    sendMessage(text)
      .then(function () {
        messageInput.value = "";
        return fetchMessages();
      })
      .catch(function (err) {
        chatError.textContent = err.message;
      })
      .finally(function () {
        messageInput.disabled = false;
        messageInput.focus();
      });
  });

  const stored = (function () {
    try {
      return localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return null;
    }
  })();

  if (stored) {
    username = stored;
    showChat();
  } else {
    showLogin();
  }
})();
</script>

</body>
</html>
